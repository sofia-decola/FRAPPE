[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frappe"
version = "0.1.0"
description = "Framework for Rhythmic Analysis of Preliminary Proteomics Experiments"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sofia DeCola", email = "you@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "scipy>=1.17.0",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
    "networkx>=3.3",
    "requests>=2.32.4",
    "kneed>=0.8.5",
    "alive-progress>=3.1",
]


[tool.setuptools.packages.find]
where = ["src"]